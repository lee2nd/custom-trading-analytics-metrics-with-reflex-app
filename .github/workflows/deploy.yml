name: Deploy to Reflex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid two deploys racing each other if pushes land close together.
concurrency:
  group: reflex-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Deploy to Reflex Cloud
        env:
          REFLEX_ACCESS_TOKEN: ${{ secrets.REFLEX_ACCESS_TOKEN }}
        run: |
          reflex deploy \
            --project "${{ secrets.REFLEX_PROJECT_ID }}" \
            --no-interactive
